name: mazurport
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mazurport
      POSTGRES_USER: mazurport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mazurport_local_change_me}
    volumes:
      - port-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mazurport -d mazurport"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://mazurport:${POSTGRES_PASSWORD:-mazurport_local_change_me}@db:5432/mazurport
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8082}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    init: true
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "backend/dist/seed.js"]
    environment:
      DATABASE_URL: postgres://mazurport:${POSTGRES_PASSWORD:-mazurport_local_change_me}@db:5432/mazurport
      SEED_PASSWORD: ${SEED_PASSWORD:-PortDemo123!}
    depends_on:
      api:
        condition: service_healthy
  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mazurport_test
      POSTGRES_USER: mazurport
      POSTGRES_PASSWORD: test_password
    ports:
      - "127.0.0.1:5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mazurport -d mazurport_test"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  port-data:
